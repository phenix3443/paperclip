# Build the UI of a pushed branch for the netcup staging instance (phenix3443/ai-team
# scripts/paperclip/staging.py), which serves it statically and compressed instead of
# running the Vite dev server over the tailnet. Fork-only; the host never builds Paperclip.
name: staging-ui

on:
  push:
    branches-ignore: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-ui-${{ github.sha }}
  cancel-in-progress: false

jobs:
  ui:
    if: github.repository == 'phenix3443/paperclip'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the UI
        run: |
          pnpm --filter @paperclipai/plugin-sdk ensure-build-deps
          pnpm --filter @paperclipai/ui build
          test -f ui/dist/index.html

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: staging-ui-${{ github.sha }}
          path: ui/dist
          retention-days: 7
          if-no-files-found: error
