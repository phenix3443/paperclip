# Daily: fork master merges upstream master, then develop merges master.
# Merging only. Deployment stays manual (deploy.py, backup, Board confirmation),
# because upstream migrations cannot be rolled back.
name: sync-upstream

on:
  schedule:
    - cron: "17 20 * * *" # 04:17 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'phenix3443/paperclip'
    runs-on: ubuntu-latest
    env:
      # Fine-grained PAT for this repository: Contents, Pull requests and Workflows
      # (read and write). GITHUB_TOKEN cannot push upstream workflow changes.
      GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Require the sync token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Repository secret UPSTREAM_SYNC_TOKEN is not set"
            exit 1
          fi

      - name: Merge upstream master into master
        run: gh api -X POST "repos/$REPO/merge-upstream" -f branch=master

      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}

      - name: Merge master into develop through a pull request
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          if git merge-base --is-ancestor origin/master HEAD; then
            echo "develop already contains master"
            exit 0
          fi
          day="$(date -u +%F)"
          branch="sync/master-into-develop-${day//-/}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "$branch already exists; leaving the open sync for review"
            exit 0
          fi
          git switch -c "$branch"
          if git merge --no-ff --no-edit origin/master; then
            git push origin "HEAD:refs/heads/$branch"
            url="$(gh pr create --base develop --head "$branch" \
              --title "chore: merge upstream master into develop ($day)" \
              --body "Daily sync from \`.github/workflows/sync-upstream.yml\`. Merge only; deploy separately after backup, test-drive and Board confirmation.")"
            gh pr merge "$url" --merge --delete-branch
          else
            conflicts="$(git diff --name-only --diff-filter=U)"
            git merge --abort
            title="Upstream sync needs manual conflict resolution"
            body="$(printf 'Merging \`master\` (%s) into \`develop\` on %s conflicts in:\n\n%s\n\nResolve on a branch from \`develop\`, keep develop-only fixes, and open a PR to \`develop\`.' \
              "$(git rev-parse --short origin/master)" "$day" "$(printf '%s\n' "$conflicts" | sed 's/^/- `/; s/$/`/')")"
            existing="$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')"
            if [ -n "$existing" ]; then gh issue comment "$existing" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
            exit 1
          fi
